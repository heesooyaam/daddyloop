name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm run release:build
      - run: python3 scripts/smoke-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: daddyloop-linux-${{ matrix.arch }}
          path: |
            .daddyloop/releases/*linux-${{ matrix.arch }}.tar.gz
            .daddyloop/releases/*linux-${{ matrix.arch }}.tar.gz.sha256
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: daddyloop-linux-*
          path: release-assets
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "daddyloop $GITHUB_REF_NAME" --notes-file docs/release-notes/en.md install.sh release-assets/*
