<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Reviewloop — два агента, один рабочий цикл</title>
  <desc id="desc">Автор получает опубликованные замечания, исправляет код и возвращает новую ревизию ревьюеру. Управление через CLI, сайт, телефон и Telegram.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#edf5ef"/><stop offset="1" stop-color="#f8f7f0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2b654b" opacity=".09"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 5 4-5 4" fill="none" stroke="#569373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#paper)"/>
  <rect x="745" width="535" height="400" rx="22" fill="url(#dots)"/>
  <g font-family="Inter, 'YS Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="50" y="41" width="39" height="39" rx="11" fill="#286c51"/>
    <g transform="translate(58 49)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a9 9 0 0 0-16-3M3 1v5h5M3 15a9 9 0 0 0 16 3m1 4v-5h-5"/></g>
    <text x="103" y="71" font-size="31" font-weight="750" letter-spacing="-1.2" fill="#204b39">reviewloop<tspan fill="#6aab7a">.</tspan></text>
    <text x="50" y="154" font-size="48" font-weight="700" letter-spacing="-1.8" fill="#203d30">Два агента.</text>
    <text x="50" y="212" font-size="48" font-weight="700" letter-spacing="-1.8" fill="#203d30">Один рабочий цикл.</text>
    <text x="52" y="261" font-size="19" fill="#607469">Обсуждай замечания. Публикуй ревью.</text>
    <text x="52" y="290" font-size="19" fill="#607469">Возвращай исправления на проверку.</text>
    <text x="52" y="353" font-size="11" font-weight="650" letter-spacing="2" fill="#467e5e">CLI  /  WEB  /  PHONE  /  TELEGRAM</text>
    <rect x="1025" y="36" width="205" height="28" rx="14" fill="#e3eee4"/>
    <text x="1127" y="54" text-anchor="middle" font-size="10" letter-spacing="1.1" font-weight="650" fill="#52755c">v0.2 · LINUX x64 / ARM64</text>
    <path d="M1084 139h46q25 0 25 25v72q0 25-25 25h-41" fill="none" stroke="#569373" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M866 261h-35q-25 0-25-25v-72q0-25 25-25h34" fill="none" stroke="#569373" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="861" y="99" width="231" height="80" rx="15" fill="#d6e6d9" opacity=".5" transform="translate(0 4)"/>
    <rect x="861" y="99" width="231" height="80" rx="15" fill="#fff" stroke="#d9e6dc"/>
    <rect x="881" y="119" width="40" height="40" rx="11" fill="#eaf3ec"/>
    <path d="m901 127 8 3v6c0 6-8 10-8 10s-8-4-8-10v-6z m-4 9 3 3 5-6" stroke="#4e8b64" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="936" y="134" font-size="17" font-weight="650" fill="#2d4f3b">Ревьюер</text>
    <text x="936" y="154" font-size="11" fill="#819587">Проверяет ревизию</text>
    <rect x="861" y="221" width="231" height="80" rx="15" fill="#d6e6d9" opacity=".5" transform="translate(0 4)"/>
    <rect x="861" y="221" width="231" height="80" rx="15" fill="#fff" stroke="#d9e6dc"/>
    <rect x="881" y="241" width="40" height="40" rx="11" fill="#edf1f8"/>
    <path d="m896 255-5 6 5 6m10-12 5 6-5 6m-3-15-4 18" stroke="#7896b0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="936" y="256" font-size="17" font-weight="650" fill="#2d4f3b">Автор</text>
    <text x="936" y="276" font-size="11" fill="#819587">Исправляет код</text>
    <text x="976" y="204" text-anchor="middle" font-size="11" fill="#a78349">публикация под твоим контролем</text>
    <circle cx="896" cy="350" r="3.5" fill="#7ba887"/>
    <text x="909" y="354" font-size="12" fill="#688270">Один хост. Постоянные сессии.</text>
  </g>
</svg>
